[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campura-vision-plugin"
version = "0.1.0"
description = "Campura One offline single-camera vision prototype"
requires-python = ">=3.9"

[project.scripts]
campura-vision = "campura_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
